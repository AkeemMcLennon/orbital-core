name = "orbital-auth"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"

[vars]
BETTER_AUTH_URL = "https://orbital-auth.akeem-b8b.workers.dev"
# BetterAuth derives basePath from BETTER_AUTH_URL pathname.
# Root URL = basePath "/" = routes at /sign-in/email, /oauth2/authorize, etc.

[observability]
[observability.logs]
enabled = true
invocation_logs = true

[[d1_databases]]
binding = "DB"
database_name = "orbital-auth-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "src/database/migrations"

[dev]
port = 8788
