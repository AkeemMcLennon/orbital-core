<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbital — Sign In</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.2.1/dist-cdn/styles/webawesome.css" />
  <script type="module" src="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.2.1/dist-cdn/webawesome.loader.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--wa-color-surface-lowered);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--wa-color-text-normal);
    }
    .card {
      width: 100%;
      max-width: 400px;
      padding: 2rem;
      background: var(--wa-color-surface-raised);
      border-radius: 0.75rem;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
    }
    .card h1 {
      text-align: center;
      margin: 0 0 1.5rem;
      font-size: 1.5rem;
      color: var(--wa-color-text-normal);
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    form wa-button { margin-top: 0.5rem; }
    .error-callout { margin-bottom: 1rem; }
    .error-callout[hidden] { display: none; }

    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--wa-color-border-normal);
      border-radius: 0.5rem;
      background: var(--wa-color-surface-raised);
      color: var(--wa-color-text-normal);
      font-size: 0.95rem;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .google-btn:hover {
      background: var(--wa-color-surface-lowered);
      border-color: var(--wa-color-border-hover);
    }
    .google-btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1.25rem 0;
      color: var(--wa-color-text-muted);
      font-size: 0.85rem;
    }
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--wa-color-border-normal);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Orbital</h1>

    <wa-callout id="error-callout" variant="danger" class="error-callout" hidden>
      <span id="error-message"></span>
    </wa-callout>

    <button type="button" class="google-btn" id="google-sign-in">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18A10.96 10.96 0 0 0 1 12c0 1.77.42 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Sign in with Google
    </button>

    <div class="divider">or</div>

    <wa-tab-group>
      <wa-tab slot="nav" panel="sign-in" active>Sign In</wa-tab>
      <wa-tab slot="nav" panel="register">Register</wa-tab>

      <wa-tab-panel name="sign-in">
        <form id="sign-in-form" action="/sign-in/email" method="POST">
          <wa-input name="email" type="email" label="Email" required></wa-input>
          <wa-input name="password" type="password" label="Password" password-toggle required></wa-input>
          <wa-button type="submit" variant="brand" style="width:100%">Sign In</wa-button>
        </form>
      </wa-tab-panel>

      <wa-tab-panel name="register">
        <form id="register-form" action="/sign-up/email" method="POST">
          <wa-input name="name" type="text" label="Name" required></wa-input>
          <wa-input name="email" type="email" label="Email" required></wa-input>
          <wa-input name="password" type="password" label="Password" password-toggle required></wa-input>
          <wa-button type="submit" variant="brand" style="width:100%">Create Account</wa-button>
        </form>
      </wa-tab-panel>
    </wa-tab-group>
  </div>

  <script>
    // BetterAuth redirects here with the OAuth params as query params (e.g. ?client_id=...&redirect_uri=...)
    // We capture them all and pass them back to the authorize endpoint after authentication.
    const queryString = window.location.search.slice(1);
    const callbackURL = queryString ? '/oauth2/authorize?' + queryString : '/';

    document.getElementById('google-sign-in').addEventListener('click', async () => {
      document.getElementById('error-callout').hidden = true;
      try {
        const res = await fetch('/sign-in/social', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ provider: 'google', callbackURL }),
        });
        const json = await res.json();
        if (json.url) {
          window.location.href = json.url;
        } else if (!res.ok) {
          const msg = json?.message || json?.error?.message || 'Google sign-in failed.';
          document.getElementById('error-message').textContent = msg;
          document.getElementById('error-callout').hidden = false;
        }
      } catch {
        document.getElementById('error-message').textContent = 'Network error. Please try again.';
        document.getElementById('error-callout').hidden = false;
      }
    });

    document.querySelectorAll('form').forEach(form => {
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        document.getElementById('error-callout').hidden = true;

        const data = {};
        form.querySelectorAll('wa-input').forEach(el => { data[el.name] = el.value; });
        data.callbackURL = callbackURL;

        try {
          const res = await fetch(form.action, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data),
            redirect: 'follow',
          });

          if (res.redirected) {
            window.location.href = res.url;
            return;
          }

          const json = await res.json();

          if (res.ok) {
            // BetterAuth returns { url } for redirects, or { token, user } for direct auth
            if (json.url) {
              window.location.href = json.url;
            } else if (json.token || json.user) {
              // Auth succeeded — redirect to the callbackURL
              window.location.href = callbackURL;
            }
            return;
          }

          const msg = json?.message || json?.error?.message || 'Authentication failed.';
          document.getElementById('error-message').textContent = msg;
          document.getElementById('error-callout').hidden = false;
        } catch {
          document.getElementById('error-message').textContent = 'Network error. Please try again.';
          document.getElementById('error-callout').hidden = false;
        }
      });
    });
  </script>
</body>
</html>
