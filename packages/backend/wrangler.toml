name = "orbital-api"
main = "src/app.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# This line prevents dashboard variables from being overwritten
keep_vars = true 

[alias]
"bun:sqlite" = "./bun-stub.js"

[vars]
JWKS_URL = "https://orbital-auth.akeem-b8b.workers.dev/jwks"
JWT_ISSUER = "https://orbital-auth.akeem-b8b.workers.dev"
JWT_AUDIENCE = "https://orbital-auth.akeem-b8b.workers.dev"

[observability]
[observability.logs]
enabled = true
invocation_logs = true

# For production with Cloudflare D1
# Create production database: wrangler d1 create orbital-db
[[d1_databases]]
binding = "DB"
database_name = "orbital-db"
migrations_dir = "src/database/migrations"
