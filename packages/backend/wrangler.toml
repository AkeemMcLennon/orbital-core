name = "orbital-api"
main = "src/app.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# This line prevents dashboard variables from being overwritten
keep_vars = true

[alias]
"bun:sqlite" = "./bun-stub.js"

[vars]
JWKS_URL = "https://auth.example.com/jwks"
JWT_ISSUER = "https://auth.example.com"
JWT_AUDIENCE = "https://auth.example.com"
LLM_BASE_URL = "https://gateway.ai.cloudflare.com/v1/REPLACE_WITH_CF_ACCOUNT_ID/orbital-diy/compat"
LLM_FAST_MODEL = "cerebras/gpt-oss-120b"
LLM_VISION_MODEL = "workers-ai/@cf/google/gemma-4-26b-a4b-it"

[triggers]
crons = ["0 2 * * *"]

[observability]
[observability.logs]
enabled = true
invocation_logs = true

# For production with Cloudflare D1
# Create production database: wrangler d1 create orbital-db
[[d1_databases]]
binding = "DB"
database_name = "orbital-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "src/database/migrations"
